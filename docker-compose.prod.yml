# Прод: секреты только из окружения/secret-store, наружу — только edge
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: crm, POSTGRES_PASSWORD_FILE: /run/secrets/db_password, POSTGRES_DB: crm }
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  api:
    build: { context: ./backend, target: prod }
    environment:
      ENV: prod
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on: [db]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  web:
    build: { context: ./frontend, target: prod }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
  edge:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: [./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [api, web]
    restart: unless-stopped
secrets:
  db_password: { environment: DB_PASSWORD }
volumes:
  pgdata:
