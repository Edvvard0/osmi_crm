# Заголовки безопасности (docs/api-contract-m12.md, «Заголовки безопасности и edge-прокси»).
# add_header в nginx не наследуется в location, где задан свой add_header, поэтому файл
# подключается (include) в каждый location. Значения API (CSP, nosniff и т.д.) скрываются,
# чтобы в ответе не было дублей.
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-Powered-By;
proxy_hide_header Server;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
