# Edge-прокси DEV (HTTP, без TLS). Прод-конфиг — nginx.prod.conf.template (TLS, JSON-ошибки, лимиты входа).
# CSP и остальные заголовки — те же, что в проде (docs/api-contract-m12.md), кроме HSTS (нет HTTPS).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Те же заголовки ставит API — скрываем его копии, чтобы не было дублей.
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;
  proxy_hide_header X-Powered-By;

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
  location / {
    proxy_pass http://web:8080;
    proxy_set_header Host $host;
  }
}
