name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_USER: crm, POSTGRES_PASSWORD: crm, POSTGRES_DB: crm_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U crm" --health-interval 3s --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://crm:crm@localhost:5432/crm_test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest --cov --cov-fail-under=85
      - run: pip-audit
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run test:cov
      - run: npm audit --audit-level=high
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx run semgrep --config auto --error .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, severity: "HIGH,CRITICAL", exit-code: "1" }
      # Compose проверяет обязательные переменные (${VAR:?}) даже при build — задаём фиктивные значения.
      - run: docker compose -f docker-compose.prod.yml build
        env:
          SECRET_KEY: ci-secret-key-000000000000000000000000
          POSTGRES_PASSWORD: ci
          DB_MIGRATOR_PASSWORD: ci
          DB_APP_PASSWORD: ci
          DOMAIN: ci.invalid
